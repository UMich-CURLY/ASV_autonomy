name: asv_perception

channels:
  - pytorch
  - nvidia/label/cuda-12.4.0
  - nvidia
  - conda-forge
  - defaults

variables:
  PYTHONNOUSERSITE: "1"

dependencies:
  - python=3.10
  - pip
  
  #pytorch deps
  - pytorch=2.5.1
  - torchvision=0.20.1
  - torchaudio=2.5.1
  - pytorch-cuda=12.4
  
  # CUDA 12.4 compiler/toolchain pieces
  - cuda-compiler=12.4.*
  - cuda-nvcc=12.4.*
  - cuda-nvcc_linux-64=12.4.*
  - cuda-cudart=12.4.*
  - cuda-cudart-dev=12.4.*
  - cuda-libraries-dev=12.4.*
  - cuda-cccl=12.4.*
  - gcc_linux-64=12.*
  - gxx_linux-64=12.*

  - numpy=1.24.4
  - scipy
  - matplotlib
  - pillow
  - pyyaml
  - requests
  - tqdm
  - opencv
  - jinja2
  - networkx
  - sympy=1.13.1
  - ffmpeg
  - packaging=24.2
  - fsspec
  - mpmath

  - cmake
  - ninja
  - pybind11
  - sparsehash

  #don't put sam2, ros2-numpy, torchsparse here
  #take care of those with 'setup_asv_perception_after_conda.sh' afterwards
  - pip:
      - addict==2.4.0
      - gtsam==4.2
      - huggingface-hub==0.28.1
      - hydra-core==1.3.2
      - iopath==0.1.10
      - joblib==1.4.2
      - platformdirs==4.3.6
      - polars==1.38.1
      - psutil==7.2.2
      - pybase64==1.4.0
      - pycocotools==2.0.8
      - regex==2024.11.6
      - safetensors==0.5.2
      - supervision==0.25.1
      - threadpoolctl==3.5.0
      - timm==1.0.14
      - tokenizers==0.21.0
      - tomli==2.2.1
      - transformations==2024.5.24
      - transformers==4.48.3
      - transforms3d==0.4.2
      - typing-extensions==4.12.2
      - ultralytics==8.4.12
      - ultralytics-thop==2.0.18
      - yapf==0.43.0
      - portalocker==3.2.0
      - omegaconf==2.3.0
      - antlr4-python3-runtime==4.9.3
