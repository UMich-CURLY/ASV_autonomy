vectornav:
  ros__parameters:
    # Use a udev alias like /dev/vectornav once one is configured on the Jetson.
    # Keep this config intentionally lean so a VN-100 can sustain 100 Hz over 115200 baud.
    port: "/dev/ttyUSB0"
    baud: 115200
    reconnect_ms: 500
    adjust_ros_timestamp: true
    AsyncDataOutputType: 0
    AsyncDataOutputFrequency: 20
    syncInMode: 3
    syncInEdge: 0
    syncInSkipFactor: 0
    syncOutMode: 0
    syncOutPolarity: 0
    syncOutSkipFactor: 0
    syncOutPulseWidth_ns: 100000000
    serialCount: 0
    serialStatus: 0
    spiCount: 0
    spiStatus: 0
    serialChecksum: 1
    spiChecksum: 0
    errorMode: 1
    BO1:
      asyncMode: 1
      rateDivisor: 8
      # Required for /vectornav/imu:
      # bit 0  TimeStartup
      # bit 4  Quaternion
      # bit 5  AngularRate
      # bit 8  Accel
      commonField: 0x131
      timeField: 0x0000
      imuField: 0x0000
      attitudeField: 0x0000
      gps2Field: 0x0000
    BO2:
      asyncMode: 0
      rateDivisor: 0
      commonField: 0x0000
      timeField: 0x0000
      imuField: 0x0000
      gpsField: 0x0000
      attitudeField: 0x0000
      insField: 0x0000
      gps2Field: 0x0000
    BO3:
      asyncMode: 0
      rateDivisor: 0
      commonField: 0x0000
      timeField: 0x0000
      imuField: 0x0000
      gpsField: 0x0000
      attitudeField: 0x0000
      insField: 0x0000
      gps2Field: 0x0000
    frame_id: "imu_link"

vn_sensor_msgs:
  ros__parameters:
    use_enu: true
    orientation_covariance: [0.01, 0.0, 0.0,
                             0.0, 0.01, 0.0,
                             0.0, 0.0, 0.01]
    angular_velocity_covariance: [0.01, 0.0, 0.0,
                                  0.0, 0.01, 0.0,
                                  0.0, 0.0, 0.01]
    linear_acceleration_covariance: [0.01, 0.0, 0.0,
                                     0.0, 0.01, 0.0,
                                     0.0, 0.0, 0.01]
    magnetic_covariance: [0.01, 0.0, 0.0,
                          0.0, 0.01, 0.0,
                          0.0, 0.0, 0.01]
